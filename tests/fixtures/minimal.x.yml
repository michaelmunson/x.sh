name: minimal
description: tiny fixture app for integration tests
commands:
  greet:
    description: say hello
    options:
      - "[-v | --verbose]"
    arguments:
      - "<name>"
"$":
  greet: |
    if [[ $(x-opt verbose) == true ]]; then
      echo "verbose hi $(x-arg name)"
    else
      echo "hi $(x-arg name)"
    fi
