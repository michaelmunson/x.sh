[package]
name = "x-plugin-ai-cmd-gen"
version = "0.1.0"
edition = "2021"
description = "Generate shell commands from natural-language instructions via configured LLM"
publish = false

[[bin]]
name = "ai-cmd-gen"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.0", features = ["derive"] }
dirs = "5.0"
