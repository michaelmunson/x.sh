[package]
name = "x-plugin-openapi"
version = "0.1.0"
edition = "2021"
description = "Convert an OpenAPI specification into an x.sh app"
publish = false

[[bin]]
name = "openapi"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
