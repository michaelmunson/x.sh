
# documentation: https://github.com/michaelmunson/x.sh/blob/main/README.md#app-framework
# examples:      https://github.com/michaelmunson/x.sh/blob/main/docs/examples/app/exapp.x.yml

name: xpkg
version: 0.0.0
description: x package meta app

commands:
  build:
    description: build the binary/docs
  test:
    description: run the tests
    options:
      - '[--complete]'
      - '[--integration]'

$:
  build: |
    cargo build --release
  test: |
    if [ "$(x-opt "complete")" = "true" ]; then
      cargo test complete:: # this is a test for the complete module
    elif [ "$(x-opt "integration")" = "true" ]; then
      cargo test cli_integration::complete # this is a test for the integration tests
    else
      cargo test --bin x # this is a test for the x binary
    fi