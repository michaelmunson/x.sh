# metadata
name: my-app
version: 0.0.0
description: an example x.sh app

# top-level options (apply to the root command)
options:
  - "[-v | --version]"

# top-level arguments
arguments:
  - "[<topic='overview'>]"

# nested commands are dot-prefixed keys; each may have its own
# help/args/opts/dir/env and its own nested `.sub-command` keys
.build:
  description: build the project
  options:
    - "[--input=<file> [--output=<dir>]]"
    - "[--mode={fast|safe|deep}]"
  arguments:
    - "<assets>..."
  $: |
    echo "mode=$(x-opt mode), assets=$(x-arg assets)"

.create:
  description: create things
  $: x-usage create        # default: print help when called bare

  .file:
    description: create a file
    arguments: "<path> [<content='empty'>]"
    $: |
      echo "creating $(x-arg path) with $(x-arg content)"

  .folder:
    arguments: "<path>"
    $: |
      mkdir -p "$(x-arg path)"
