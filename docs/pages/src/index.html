<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta name="description" content="Comprehensive documentation for x.sh — a script management CLI and YAML app framework."/>
    <title>x.sh Documentation</title>
    <script>
      (function () {
        var m = location.pathname.match(/^(\/x\.sh)(?:\/|$)/);
        var base = document.createElement("base");
        base.href = m ? m[1] + "/" : "/";
        document.head.appendChild(base);
      })();
    </script>
    <style></style>
  </head>
  <body>
    <script src="index.ts" type="module"></script>
  </body>
</html>
